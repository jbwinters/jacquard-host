[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jacquard-host"
dynamic = ["version"]
description = "Language-neutral host integrations and adapters for Jacquard"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
keywords = ["jacquard", "algebraic-effects", "embedding"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/jbwinters/jacquard-host"
Issues = "https://github.com/jbwinters/jacquard-host/issues"
Documentation = "https://github.com/jbwinters/jacquard-host/blob/main/docs/PYTHON-SDK.md"
Changelog = "https://github.com/jbwinters/jacquard-host/blob/main/CHANGELOG.md"

[project.scripts]
jacquard-host-kit = "jacquard_host.kit:main"
jacquard-host-trial = "jacquard_host.trial:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "jacquard_host.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
jacquard_host = ["py.typed", "data/jacquard/*.jac", "data/conformance/host-protocol-v0/*.json", "data/conformance/host-protocol-v0/kit/*"]
