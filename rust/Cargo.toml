[package]
name = "jacquard-host"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "Independent Rust adapter for Jacquard Core's experimental jacquard-host-v0 protocol"
license = "Apache-2.0"
repository = "https://github.com/jbwinters/jacquard-host"
readme = "README.md"
include = ["src/**", "tests/**", "kit/**", "README.md", "LICENSE", "NOTICE", "Cargo.toml"]

[dependencies]

[[bin]]
name = "jacquard-host-standin"
path = "src/bin/standin.rs"
doc = false
