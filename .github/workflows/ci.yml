name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci
        working-directory: typescript
      - run: npm test
        working-directory: typescript
      - run: npm run check:package
        working-directory: typescript

  go:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.24", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go/go.mod
      - name: Check formatting
        working-directory: go
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
        working-directory: go
      - name: Offline tests with the race detector
        run: go test -race -count=1 ./...
        working-directory: go

  rust:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.88", "stable"]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install ${{ matrix.rust }} --profile minimal --component rustfmt,clippy
          rustup override set ${{ matrix.rust }}
      - name: Check formatting
        run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Offline tests
        run: cargo test --locked

  java:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["21", "25"]
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: java/pom.xml
      - name: Offline adapter and SDK tests
        run: mvn -B -ntp verify

  dotnet:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dotnet: ["8.0", "10.0"]
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}.x
      # The runner may also have a newer SDK, which dotnet would pick by
      # default. Pin this job to the .NET 8 SDK so it builds as an 8.0-only
      # toolchain would (the test project targets net8.0 alone there).
      - name: Pin the .NET 8 SDK
        if: matrix.dotnet == '8.0'
        run: |
          printf '{"sdk":{"version":"8.0.100","rollForward":"latestFeature"}}\n' > global.json
          dotnet --version | grep '^8\.0\.'
      - name: Offline tests
        run: dotnet test test/JacquardHost.Tests -f net${{ matrix.dotnet }}

  bootstrap:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check the Core pin and generated files
        run: python scripts/core_pin.py check
      - name: Compile sources
        run: python -m compileall -q src tests examples scripts
      - name: Run unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Install build tools
        run: python -m pip install 'setuptools>=68' wheel
      - name: Check installed distribution
        run: python scripts/check_distribution.py

  live-examples:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the pinned Core release
        run: python scripts/core_pin.py install --github-env
      - name: Install SDK wheel
        run: python -m pip install .
      - name: Run live suite against installed SDK
        run: python -m unittest discover -s tests -v
      - name: Run public examples
        run: python scripts/check_examples.py
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: Install TypeScript development tools
        run: npm ci
        working-directory: typescript
      - name: Run independent TypeScript adapter and SDK against Core
        run: npm run test:live
        working-directory: typescript
      - name: Check installed npm tarball and all four examples
        run: npm run check:package
        working-directory: typescript
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: go/go.mod
      - name: Run independent Go adapter against Core
        run: go test -count=1 -v ./...
        working-directory: go
      - name: Install the Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Run independent Rust adapter against Core
        run: cargo test --locked -- --nocapture
        working-directory: rust
        env:
          JACQUARD_REQUIRE_LIVE: "1"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: java/pom.xml
      - name: Run independent Java adapter and SDK against Core
        run: mvn -B -ntp verify
        working-directory: java
        env:
          JACQUARD_REQUIRE_LIVE: "1"
      - name: Run the four example projects through the Java SDK
        working-directory: java
        run: |
          set -euo pipefail
          run() { java -cp target/classes:target/test-classes org.jacquardlang.host.examples.JacquardExamples --workdir "$RUNNER_TEMP/java-examples" "$@"; }
          run quickstart
          run planner | grep -q '"score": 16'
          run triage | grep -q '"urgency": "WATCH"'
          run fulfillment | grep -q '"$tag": "Fulfilled"'
          run fulfillment | grep -q '"$tag": "DuplicateOrder"'
          status=0
          run --workdir "$RUNNER_TEMP/java-recovery" --fault publish-failed fulfillment || status=$?
          test "$status" = 1
          run --workdir "$RUNNER_TEMP/java-recovery" --deliver-pending fulfillment | grep -q '{"delivered":1}'
          run --workdir "$RUNNER_TEMP/java-recovery" --deliver-pending fulfillment | grep -q '{"delivered":0}'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Run independent .NET adapter and SDK against Core
        run: |
          dotnet test test/JacquardHost.Tests -f net8.0
          dotnet test test/JacquardHost.Tests -f net10.0
        working-directory: dotnet
        env:
          JACQUARD_REQUIRE_LIVE: "1"
      - name: Run the four example projects through the .NET SDK
        working-directory: dotnet
        run: |
          set -euo pipefail
          # The SDK refuses a program cache under a directory another user
          # could write; check $RUNNER_TEMP's ancestry here by the same rule,
          # so a runner set up otherwise fails clearly rather than inside the
          # SDK. A group-writable level passes only when its group is the
          # user's private group: the user's primary group, named as the user,
          # no other listed member, and no access ACL; and getent passwd
          # succeeds, prints at most 16 MiB ending in a newline, lists at most
          # 100,000 well-formed entries with no name twice, lists the user
          # with that primary group, and lists no account of another uid
          # with it.
          me=$(id -un); uid=$(id -u); gid=$(id -g)
          private=no
          listing=$(mktemp)
          trap 'rm -f "$listing"' EXIT
          passwd_status=0
          # At most one byte over the cap is kept; a longer listing fails (getent is stopped) and is refused.
          getent passwd | head -c 16777217 > "$listing" || passwd_status=$?
          size=$(wc -c < "$listing")
          group_status=0
          group_entry=$(getent group "$gid") || group_status=$?
          if [ "$passwd_status" = 0 ] && [ "$group_status" = 0 ] \
            && [ "$size" -gt 0 ] && [ "$size" -le 16777216 ] \
            && [ "$(tail -c 1 "$listing" | od -An -tx1 | tr -d ' \n')" = 0a ] \
            && awk -F: -v n="$me" -v u="$uid" -v g="$gid" '
                NF != 7 || $1 == "" || $3 !~ /^(0|[1-9][0-9]*)$/ || $4 !~ /^(0|[1-9][0-9]*)$/ || seen[$1]++ { bad = 1; exit }
                $1 == n { if ($3 != u || $4 != g) { bad = 1; exit }; listed = 1; next }
                $4 == g && $3 != u { bad = 1; exit }
                END { exit (bad || !listed || NR > 100000) }' "$listing" \
            && [ "$(printf '%s\n' "$group_entry" | cut -d: -f1)" = "$me" ] \
            && [ -z "$(printf '%s\n' "$group_entry" | cut -d: -f4 | tr , '\n' | grep -vx "$me")" ]; then
            private=yes
          fi
          rm -f "$listing"
          d=$(realpath "$RUNNER_TEMP")
          while :; do
            mode=$(stat -c %a "$d"); owner=$(stat -c %u "$d"); group=$(stat -c %g "$d")
            bad=
            if [ "$owner" != "$uid" ] && [ "$owner" != 0 ]; then
              bad="owned by another user"
            elif [ $((0$mode & 01000)) = 0 ] && [ $((0$mode & 02)) != 0 ]; then
              bad="writable by others"
            elif [ $((0$mode & 01000)) = 0 ] && [ $((0$mode & 020)) != 0 ]; then
              if [ "$group" != "$gid" ] || [ "$private" != yes ]; then
                bad="writable by its group, which is not your private group"
              elif ls -ld "$d" | cut -c11 | grep -q '+'; then
                bad="writable by its group, with an access control list"
              fi
            fi
            if [ -n "$bad" ]; then
              echo "::error::$d (mode $mode, owner $owner, group $group) is $bad; the .NET SDK refuses a cache under it" >&2
              exit 1
            fi
            [ "$d" = / ] && break
            d=$(dirname "$d")
          done
          dotnet build examples/JacquardExamples
          run() { dotnet examples/JacquardExamples/bin/Debug/net8.0/JacquardExamples.dll --workdir "$RUNNER_TEMP/dotnet-examples" "$@"; }
          run quickstart
          run planner | grep -q '"score": 16'
          run triage | grep -q '"urgency": "WATCH"'
          run fulfillment | grep -q '"$tag": "Fulfilled"'
          run fulfillment | grep -q '"$tag": "DuplicateOrder"'
          status=0
          run --workdir "$RUNNER_TEMP/dotnet-recovery" --fault publish-failed fulfillment || status=$?
          test "$status" = 1
          run --workdir "$RUNNER_TEMP/dotnet-recovery" --deliver-pending fulfillment | grep -q '{"delivered":1}'
          run --workdir "$RUNNER_TEMP/dotnet-recovery" --deliver-pending fulfillment | grep -q '{"delivered":0}'
